<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naascco - Cancellation Requests</title>
    <link rel="stylesheet" href="../assets/css/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="body-wrap">
        <div class="app-container flex min-h-screen">
            <!-- Sidebar -->
            <aside
                class="sidebar fixed left-6 top-6 z-[1000] flex flex-col overflow-hidden transition-all duration-300">
                <div class="logo-container border-b-2 border-[#fff]">
                    <div class="logo-box">
                        <img src="../assets/images/logo.png" alt="Logo" class="full-logo">
                        <img src="../assets/images/logo-icon.png" alt="Logo Icon" class="mini-logo"
                            style="display: none;">
                    </div>
                    <button id="sidebar-toggle" class="sidebar-toggle">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button id="sidebar-close" class="sidebar-close">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <nav class="nav-menu">
                    <div class="nav-group">
                        <div class="nav-group-title">MAIN MENU</div>
                        <a href="../index.html" class="nav-item">
                            <i class="fas fa-th-large"></i>
                            <span>Dashboard</span>
                        </a>
                        <a href="create-parcel.html" class="nav-item">
                            <i class="fas fa-plus-circle"></i>
                            <span>Create Parcel</span>
                        </a>
                        <a href="consignment.html" class="nav-item">
                            <i class="fas fa-archive"></i>
                            <span>Consignments</span>
                        </a>
                        <a href="add-fund.html" class="nav-item">
                            <i class="fas fa-wallet"></i>
                            <span>Add Fund</span>
                        </a>
                        <a href="pickup-request.html" class="nav-item">
                            <i class="fas fa-truck-pickup"></i>
                            <span>Pickup Request</span>
                        </a>
                        <a href="pricing.html" class="nav-item">
                            <i class="fas fa-tag"></i>
                            <span>Pricing</span>
                        </a>
                        <a href="#" class="nav-item">
                            <i class="fas fa-print"></i>
                            <span>Bulk Print</span>
                        </a>
                        <a href="moderator.html" class="nav-item">
                            <i class="fas fa-users"></i>
                            <span>Moderators</span>
                        </a>
                        <a href="track-parcel.html" class="nav-item">
                            <i class="fas fa-paper-plane"></i>
                            <span>Track Orders</span>
                        </a>
                        <a href="my-order.html" class="nav-item">
                            <i class="fas fa-list-ul"></i>
                            <span>My Orders</span>
                        </a>
                        <a href="return-request.html" class="nav-item active">
                            <i class="fas fa-undo"></i>
                            <span>Return Request</span>
                        </a>
                    </div>

                    <div class="nav-group">
                        <div class="nav-group-title">OTHERS</div>
                        <a href="#" class="nav-item">
                            <i class="fas fa-cog"></i>
                            <span>Settings</span>
                        </a>
                        <a href="change-pass.html" class="nav-item">
                            <i class="fas fa-lock"></i>
                            <span>Change Password</span>
                        </a>
                        <a href="#" class="nav-item">
                            <i class="fas fa-history"></i>
                            <span>Login History</span>
                        </a>
                        <a href="two-factor-auth.html" class="nav-item">
                            <i class="fas fa-shield-alt"></i>
                            <span>Two-Factor Auth</span>
                        </a>
                        <a href="#" class="nav-item">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>Logout</span>
                        </a>
                    </div>
                </nav>

                <div class="sidebar-footer">
                    <a href="#" class="logout-btn">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Log out</span>
                    </a>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="main-content  flex-1 flex flex-col relative transition-all duration-300">
                <!-- Top Bar -->
                <header class="top-bar">
                    <div class="top-bar-left flex items-center gap-4 flex-1">
                        <button id="mobile-sidebar-toggle" class="mobile-sidebar-toggle">
                            <i class="fas fa-bars"></i>
                        </button>
                        <div
                            class="search-box gap-2 flex items-center bg-white border border-[#E2E8F0] rounded-full p-2 w-full max-w-[400px]">
                            <i class="fas fa-search text-[#94A3B8]"></i>
                            <input name="search" id="search" type="text" placeholder="Search request..."
                                class="bg-transparent border-none outline-none text-sm w-full text-[#64748B]">
                        </div>
                    </div>
                    <div class="top-bar-right flex items-center gap-4">
                        <!-- Balance Widget -->
                        <div
                            class="balance-widget flex items-center bg-white border border-[#E2E8F0] rounded-full p-1 pl-6 gap-8">
                            <span class="text-[#1E293B] font-semibold text-sm whitespace-nowrap">0 $</span>
                            <button
                                class="details-btn bg-[#003EB7] text-white rounded-full px-6 py-2 text-xs font-bold hover:bg-[#002D87] transition-all">Details</button>
                        </div>

                        <!-- Language Switcher -->
                        <div
                            class="header-icon flex items-center justify-center bg-white border border-[#E2E8F0] rounded-full w-11 h-11 cursor-pointer text-[#64748B] font-bold text-xs hover:bg-slate-50 hover:text-[#003EB7] transition-all">
                            EN
                        </div>

                        <div
                            class="notification-bell header-icon flex items-center justify-center bg-white border border-[#E2E8F0] rounded-full w-11 h-11 cursor-pointer text-[#003EB7] hover:bg-slate-50 transition-all">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M2.52992 14.394C2.31727 15.7471 3.268 16.6862 4.43205 17.1542C8.89481 18.9486 15.1052 18.9486 19.5679 17.1542C20.732 16.6862 21.6827 15.7471 21.4701 14.394C21.3394 13.5625 20.6932 12.8701 20.2144 12.194C19.5873 11.2975 19.525 10.3197 19.5249 9.27941C19.5249 5.2591 16.1559 2 12 2C7.84413 2 4.47513 5.2591 4.47513 9.27941C4.47503 10.3197 4.41272 11.2975 3.78561 12.194C3.30684 12.8701 2.66061 13.5625 2.52992 14.394Z"
                                    stroke="#023FA3" stroke-width="1.5" stroke-linecap="round"
                                    stroke-linejoin="round" />
                                <path d="M9 21C9.79613 21.6219 10.8475 22 12 22C13.1525 22 14.2039 21.6219 15 21"
                                    stroke="#023FA3" stroke-width="1.5" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </div>
                        <div class="user-profile">
                            <img src="https://i.pravatar.cc/150?u=yeasin" alt="User Avatar"
                                class="user-avatar w-11 h-11 rounded-full border border-[#E2E8F0] cursor-pointer">
                        </div>
                    </div>
                </header>

                <!-- Dashboard Body -->
                <div class="dashboard-container px-10 py-8 bg-[#F9FAFB] min-h-screen">
                    <div class="dashboard-header flex justify-between items-center mb-10 flex-wrap gap-6">
                        <h1 class="text-[32px] font-bold text-[#111827] tracking-tight">Cancellation Requests</h1>
                        <div class="header-actions flex items-center gap-4 flex-wrap">
                            <div class="date-filter-box">
                                <input type="text" value="05-05-2026" readonly>
                                <i class="far fa-calendar-alt"></i>
                            </div>
                            <button class="btn-download-excel">Download Excel</button>
                        </div>
                    </div>

                    <!-- Filter Tabs -->
                    <div class="filter-tabs flex flex-wrap gap-3 mb-10">
                        <button class="cancellation-filter-tab active">Pending</button>
                        <button class="cancellation-filter-tab">Confirmed</button>
                        <button class="cancellation-filter-tab">Resend Request</button>
                        <button class="cancellation-filter-tab">Cancelled</button>
                        <button class="cancellation-filter-tab">Resent</button>
                    </div>

                    <!-- Table Container -->
                    <div class="cancellation-table-container">
                        <div class="cancellation-table-inner overflow-x-auto">
                            <table class="cancellation-table w-full">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>ID</th>
                                        <th>Customer Name</th>
                                        <th>Payment</th>
                                        <th>Charge</th>
                                        <th>Details</th>
                                        <th class="text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="cancellation-table-body">
                                    <!-- Dynamic Content -->
                                </tbody>
                            </table>
                        </div>

                        <!-- Pagination -->
                        <div
                            class="px-8 py-8 flex flex-col md:flex-row items-center justify-between gap-6 border-t border-[#F1F5F9] mt-4">
                            <div id="cancellation-pagination-info" class="text-sm text-[#64748B] font-medium">
                                <!-- Dynamic Info -->
                            </div>
                            <div id="cancellation-pagination-container" class="flex flex-wrap justify-center gap-2">
                                <!-- Dynamic Buttons -->
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <!-- jQuery -->
    <script src="../assets/js/jquery-3.7.1.min.js"></script>
    <script src="../assets/js/main.js"></script>
